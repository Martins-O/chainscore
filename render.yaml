services:
  - type: web
    name: chainscore-indexer
    runtime: node
    rootDir: packages/indexer
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RH_CHAIN_RPC_URL
        sync: false
      - key: AGENT_ID_ADDRESS
        sync: false
      - key: LENDING_VAULT_ADDRESS
        sync: false
      - key: PORT
        value: 3001
